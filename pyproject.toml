[project]
name = "bugmail"
version = "2.0.0"
description = "Bulk e-mail list cleaner: syntax, DNS, SMTP handshake and catch-all detection."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "dnspython>=2.4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bugmail = "bugmail.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bugmail*"]

[tool.setuptools.package-data]
bugmail = ["templates/*.html"]
